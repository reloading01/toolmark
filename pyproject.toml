[project]
name = "toolmark"
version = "0.1.0"
description = "Forensic parsing and detection for AI coding agent artifacts"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
toolmark = "toolmark.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["toolmark*"]
